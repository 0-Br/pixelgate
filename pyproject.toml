[project]
name = "pixelgate"
dynamic = ["version"]
description = "经本机回环网关调用订阅图像后端的 stdio MCP 服务"
requires-python = ">=3.12"
dependencies = [
    "openai==3.13.0",
    "mcp==2.2.0",
    "Pillow==12.3.0",
    # 下面两个由 openai 与 mcp 带进来，本包也直接 import：传输层继承 httpx2 的
    # BaseTransport，数据模型用 pydantic。显式钉住，免得上游哪天换掉 HTTP 客户端或
    # 校验库时，本包在没有任何声明的情况下静默失去依赖。
    "httpx2==2.12.0",
    "pydantic==2.13.5",
]

[project.scripts]
pixelgate = "pixelgate.server:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pixelgate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelgate"]

# 类型检查：standard 档，源码包与测试都在检查面内，零诊断。解释器不写在这里，
# 运行时用 --pythonpath 指向项目环境。
[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportDeprecated = "error"
reportUnnecessaryTypeIgnoreComment = "error"
include = ["src/pixelgate", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
